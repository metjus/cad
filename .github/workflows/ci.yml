name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Ubuntu 24.04, OCCT 7.6, Qt 6.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build g++ \
            libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-foundation-dev \
            libocct-visualization-dev libocct-data-exchange-dev libocct-ocaf-dev \
            qt6-base-dev libgl-dev libglu1-mesa-dev libgtest-dev libtbb-dev \
            libfontconfig1-dev libfreetype-dev xvfb xauth libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test (unit, geometry, UI smoke under Xvfb)
        run: ctest --test-dir build --output-on-failure --timeout 180
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: build/screenshots/*.png
          if-no-files-found: warn

  windows:
    name: Windows (MSVC, installer + in-app update round trip)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VELOPACK_VERSION: "1.2.161"
      PACK_ID: HybridCAD.App
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: hcad
          create-args: >-
            -c conda-forge
            occt=7.9
            qt6-main=6.8
            gtest
            cmake
            ninja
          cache-environment: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Put conda DLLs on PATH (moc, OCCT, Qt)
        run: Add-Content $env:GITHUB_PATH "$env:MAMBA_ROOT_PREFIX\envs\hcad\Library\bin"
      - name: Get Velopack (C library + vpk packaging tool)
        run: |
          Invoke-WebRequest "https://github.com/velopack/velopack/releases/download/$env:VELOPACK_VERSION/velopack_libc_$env:VELOPACK_VERSION.zip" -OutFile velopack_libc.zip
          Expand-Archive velopack_libc.zip -DestinationPath velopack
          Get-ChildItem velopack -Recurse -Include *.h, *win_x64* | ForEach-Object { $_.FullName }
          Add-Content $env:GITHUB_PATH "$pwd\velopack\lib"
          dotnet tool install -g vpk --version $env:VELOPACK_VERSION
          vpk -h | Select-Object -First 5
      - name: Configure (0.1.0-alpha)
        run: |
          $prefix = "$env:MAMBA_ROOT_PREFIX\envs\hcad\Library"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DHCAD_RUNTIME_DIRS="$prefix/bin" `
            -DHCAD_WITH_VELOPACK=ON -DVELOPACK_DIR="$pwd/velopack" `
            "-DHCAD_VERSION_FULL=0.1.0-alpha"
      - name: Build
        run: cmake --build build
      - name: Unit, geometry and UI tests
        run: |
          # Report any DLL the UI test cannot find (diagnoses 0xc0000135).
          $deps = dumpbin /nologo /dependents build/tests/hcad_ui_tests.exe | Select-String '\.dll' | ForEach-Object { $_.ToString().Trim() }
          foreach ($d in $deps) {
            $local = Test-Path (Join-Path build/tests $d)
            $onPath = $null -ne (Get-Command $d -ErrorAction SilentlyContinue)
            $sys = Test-Path (Join-Path $env:WINDIR "System32/$d")
            if (-not ($local -or $onPath -or $sys)) { Write-Host "MISSING DLL: $d" }
          }
          ctest --test-dir build --output-on-failure --timeout 120 -E ui_smoke
      - name: Stage and pack 0.1.0-alpha
        run: |
          ./packaging/windows/stage.ps1 -BuildDir build -StageDir stage/0.1.0 -Prefix "$env:MAMBA_ROOT_PREFIX\envs\hcad\Library"
          vpk pack --packId $env:PACK_ID --packVersion "0.1.0-alpha" --packDir stage/0.1.0 --mainExe HybridCAD.exe `
            --packTitle HybridCAD --packAuthors "HybridCAD" --channel stable --outputDir releases
          New-Item -ItemType Directory -Force installer-0.1.0 | Out-Null
          Copy-Item releases/*Setup.exe installer-0.1.0/
          Get-ChildItem releases | Format-Table Name, Length
      - name: UI smoke test (software OpenGL via Mesa llvmpipe)
        continue-on-error: true
        run: |
          # GitHub-hosted Windows runners have no GPU; the Microsoft basic
          # driver only offers OpenGL 1.1, OCCT needs 3.x, so use Mesa.
          $ver = "24.2.7"
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Copy-Item -Recurse stage/0.1.0 smoke-app
          Copy-Item mesa/x64/opengl32.dll, mesa/x64/libgallium_wgl.dll, mesa/x64/libglapi.dll smoke-app/ -ErrorAction SilentlyContinue
          $p = Start-Process smoke-app/HybridCAD.exe -ArgumentList "--smoke-test", "$pwd/screenshots-win", "--mesh", "$pwd/tests/data/scan_sphere.obj" -PassThru -Wait
          "Smoke test exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - name: Build, stage and pack 0.1.1-alpha (same code, next version)
        run: |
          cmake build "-DHCAD_VERSION_FULL=0.1.1-alpha"
          cmake --build build
          ./packaging/windows/stage.ps1 -BuildDir build -StageDir stage/0.1.1 -Prefix "$env:MAMBA_ROOT_PREFIX\envs\hcad\Library"
          vpk pack --packId $env:PACK_ID --packVersion "0.1.1-alpha" --packDir stage/0.1.1 --mainExe HybridCAD.exe `
            --packTitle HybridCAD --packAuthors "HybridCAD" --channel stable --outputDir releases
          Get-ChildItem releases | Format-Table Name, Length
          if (-not (Get-ChildItem releases/*0.1.1-alpha-delta.nupkg)) { throw "no delta package was produced" }
      - name: Install 0.1.0-alpha, update in-app to 0.1.1-alpha, uninstall
        run: ./packaging/windows/update-roundtrip.ps1 -Setup (Get-ChildItem installer-0.1.0/*Setup.exe).FullName -Feed "$pwd/releases" -PackId $env:PACK_ID -Expected 0.1.1-alpha
      - name: Upload installer and release feed
        uses: actions/upload-artifact@v4
        with:
          name: HybridCAD-0.1.1-alpha-windows-x64-installer
          path: |
            releases/*Setup.exe
            releases/*.nupkg
            releases/releases.*.json
            releases/RELEASES*
      - name: Upload update test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-test-logs
          path: update-test-logs
          if-no-files-found: ignore
      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots-win/*.png
          if-no-files-found: ignore
